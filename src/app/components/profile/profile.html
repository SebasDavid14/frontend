<div class="layout-container">
  <header class="top-navbar">
    <div class="nav-brand">TareApp</div>
    <nav class="nav-links">
      <a routerLink="/dashboard">Dashboard</a>
      <a routerLink="/tasks">Gestión de Tareas</a>
      <a routerLink="/profile" class="active">Perfil de Usuario</a>
    </nav>
    <a routerLink="/dashboard" class="btn-back">← Volver al Dashboard</a>
  </header>

  <main class="main-content">
    <div class="page-header">
      <h2>Perfil y Sesión de Usuario</h2>
      <p>Información técnica de autenticación JWT</p>
    </div>

    <div class="card profile-card">
      <div class="profile-header-info">
        <div class="avatar-box">👤</div>
        <div>
          <h3>Usuario Autenticado</h3>
          <span class="badge-active">Sesión Activa</span>
        </div>
      </div>

      <hr class="divider">

      <div class="token-section">
        <label>Token JWT de Sesión Actual:</label>
        <div class="token-box">
          <code>{{ token }}</code>
        </div>
      </div>
    </div>
  </main>
</div>
