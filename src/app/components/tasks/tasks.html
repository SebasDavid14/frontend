<div style="padding: 20px; font-family: sans-serif;">
  <a routerLink="/dashboard" style="color: #4ea8de; text-decoration: none;">← Volver al Dashboard</a>
  <h2>Gestión de Tareas</h2>

  <!-- Formulario con cancelación de evento implícita -->
  <form (submit)="add($event)" style="margin-bottom: 20px; border: 1px solid #444; padding: 15px; border-radius: 6px;">
    <h3>Crear Nueva Tarea</h3>
    <input 
      type="text" 
      placeholder="Título" 
      [(ngModel)]="newTask.title" 
      name="title" 
      style="padding: 8px; margin-right: 10px; width: 200px;"
      required>
    
    <input 
      type="text" 
      placeholder="Descripción" 
      [(ngModel)]="newTask.description" 
      name="description" 
      style="padding: 8px; margin-right: 10px; width: 300px;">
    
    <button type="button" (click)="add($event)" style="padding: 8px 16px; background-color: #2e7d32; color: white; border: none; cursor: pointer; border-radius: 4px;">
      Guardar
    </button>
  </form>

  <!-- Tabla de Listado -->
  <table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background-color: #222; color: white;">
        <th>ID</th>
        <th>Título</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of tasks">
        <td>{{ t.id }}</td>
        <td>{{ t.title }}</td>
        <td>{{ t.description }}</td>
        <td>
          <span [style.color]="t.completed ? '#4caf50' : '#ff9800'">
            {{ t.completed ? 'Completada' : 'Pendiente' }}
          </span>
        </td>
        <td>
          <button type="button" (click)="toggle(t)" style="padding: 5px 10px; cursor: pointer; margin-right: 5px;">
            Cambiar Estado
          </button>
          <button type="button" (click)="delete(t.id)" style="padding: 5px 10px; background-color: #c62828; color: white; border: none; cursor: pointer; border-radius: 4px;">
            Eliminar
          </button>
        </td>
      </tr>
      <tr *ngIf="tasks.length === 0">
        <td colspan="5" style="text-align: center; color: #888;">No hay tareas registradas.</td>
      </tr>
    </tbody>
  </table>
</div>
