<div class="auth-wrapper animate-fade">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon-circle">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h2>Crear Cuenta</h2>
      <p>Ingresa tus datos para registrarte en la plataforma</p>
    </div>

    <form class="auth-form">
      <div class="input-group">
        <label><i class="bi bi-person"></i> Nombre Completo</label>
        <input type="text" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="input-group">
        <label><i class="bi bi-envelope"></i> Correo Electrónico</label>
        <input type="email" placeholder="ejemplo@dominio.com" required>
      </div>

      <div class="input-group">
        <label><i class="bi bi-key"></i> Contraseña</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label><i class="bi bi-shield-lock"></i> Confirmar Contraseña</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">
        <span>Completar Registro</span>
        <i class="bi bi-arrow-right-short"></i>
      </button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a></span>
    </div>
  </div>
</div>
