<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crear Cuenta</h2>
      <p>Registra un nuevo usuario para comenzar</p>
    </div>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label>Nuevo Usuario</label>
        <input type="text" [(ngModel)]="userData.username" name="username" required placeholder="Elige un nombre de usuario">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="userData.password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Registrarse</button>
    </form>

    <p class="status-msg" *ngIf="message">{{ message }}</p>
    
    <div class="auth-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
