<div class="layout-container">
  <header class="top-navbar">
    <div class="nav-brand">TareApp</div>
    <nav class="nav-links">
      <a routerLink="/dashboard" class="active">Dashboard</a>
      <a routerLink="/tasks">Gestión de Tareas</a>
      <a routerLink="/profile">Perfil de Usuario</a>
    </nav>
    <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
  </header>

  <main class="main-content">
    <div class="page-header">
      <h2>Panel Principal</h2>
      <p>Resumen general de tus actividades</p>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon blue">📋</div>
        <div class="metric-data">
          <h3>Total de Tareas</h3>
          <p class="metric-value">{{ totalTasks }}</p>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon green">✅</div>
        <div class="metric-data">
          <h3>Tareas Completadas</h3>
          <p class="metric-value green-text">{{ completedTasks }}</p>
        </div>
      </div>
    </div>
  </main>
</div>
