<div class="auth-wrapper animate-fade">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon-circle">
        <i class="bi bi-person-circle"></i>
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder al panel</p>
    </div>

    <form class="auth-form">
      <div class="input-group">
        <label><i class="bi bi-envelope"></i> Correo Electrónico</label>
        <input type="email" placeholder="ejemplo@dominio.com" required>
      </div>

      <div class="input-group">
        <label><i class="bi bi-key"></i> Contraseña</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">
        <span>Ingresar a la Plataforma</span>
        <i class="bi bi-arrow-right-short"></i>
      </button>
    </form>

    <div class="auth-footer">
      <span>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></span>
    </div>
  </div>
</div>
