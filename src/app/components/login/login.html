<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>¡Bienvenido de nuevo!</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="credentials.username" name="username" required placeholder="Tu nombre de usuario">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>
    
    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
