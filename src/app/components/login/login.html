<div style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
  <h2>Iniciar Sesión</h2>
  <form (ngSubmit)="onLogin()">
    <div>
      <label>Usuario:</label><br>
      <input type="text" [(ngModel)]="credentials.username" name="username" required style="width: 100%; padding: 8px;">
    </div>
    <br>
    <div>
      <label>Contraseña:</label><br>
      <input type="password" [(ngModel)]="credentials.password" name="password" required style="width: 100%; padding: 8px;">
    </div>
    <br>
    <button type="submit" style="padding: 10px 20px; cursor: pointer;">Entrar</button>
  </form>
  <p style="color: red;" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
</div>
